plugins {
    id 'com.android.application'
}

android {
    namespace 'com.p280.chargeguard'
    compileSdk 33

    defaultConfig {
        applicationId 'com.p280.chargeguard'
        minSdk 17
        targetSdk 28
        versionCode 1
        versionName '0.1.1'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
}