
name: P280 ChargeGuard Android Build

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install Android SDK packages
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Verify project structure
        run: |
          echo "Checking project files..."

          test -f settings.gradle
          test -f build.gradle
          test -f app/build.gradle
          test -f app/src/main/AndroidManifest.xml

          test -f app/src/main/java/com/p280/chargeguard/MainActivity.java
          test -f app/src/main/res/values/styles.xml

          echo "All required files found."

      - name: Compile Java source
        run: |
          gradle --no-daemon :app:compileDebugJavaWithJavac

      - name: Verify compiled Activity
        run: |
          find app/build/intermediates \
            -name "MainActivity.class" -print

          find app/build/intermediates \
            -name "MainActivity.class" | grep -q .

          echo "MainActivity compiled successfully."

      - name: Build APK
        run: |
          gradle --no-daemon assembleDebug

      - name: Verify APK
        run: |
          ls -lh app/build/outputs/apk/debug/

          test -f app/build/outputs/apk/debug/app-debug.apk

          echo "APK generated successfully."

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: P280-ChargeGuard-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
          if-no-files-found: error
