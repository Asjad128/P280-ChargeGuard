
name: Android build

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install Android SDK packages
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Verify project structure
        run: |
          echo "Java source files:"
          find app/src/main/java -type f

          echo "Manifest:"
          cat app/src/main/AndroidManifest.xml

          echo "MainActivity source:"
          test -f app/src/main/java/com/p280/chargeguard/MainActivity.java
          head -n 5 app/src/main/java/com/p280/chargeguard/MainActivity.java

      - name: Compile Java
        run: gradle --no-daemon :app:compileDebugJavaWithJavac

      - name: Verify compiled Activity
        run: |
          find app/build/intermediates -name "MainActivity.class" -print
          find app/build/intermediates -name "MainActivity.class" | grep -q .

      - name: Build debug APK
        run: gradle --no-daemon assembleDebug

      - name: Verify APK
        run: |
          ls -lh app/build/outputs/apk/debug/
          test -f app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: P280-ChargeGuard-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
          if-no-files-found: error
